[project]
name = "wxreader"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "babel==2.18.0",
    "imageio>=2.38.1",
    "numpy>=2.5.4",
    "py7zr>=1.1.4",
    "pymupdf>=2.0",
    "pyopengl>=3.1.10",
    "pyvips==3.1.1",
    "pywinstyles>=1.8",
    "pyzipper>=0.4.0",
    "wxpython>=4.3.2",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
analysis = [
    "jinja2>=3.1.6",
    "lizard>=1.19.0",
    "radon>=6.0.1",
    "viztracer>=1.1.1",
]

[dependency-groups]
dev = [
    "babel>=2.17.0",
    "pyinstaller>=6.22.3",
]
