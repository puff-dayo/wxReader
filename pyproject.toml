[project]
name = "wxreader"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "babel==2.18.0",
    "imageio==2.37.3",
    "nuitka==4.1.3",
    "numpy>=2.5.1",
    "py7zr>=1.1.3",
    "pymupdf==1.23.8",
    "pyopengl>=3.1.10",
    "pyvips>=3.1.1",
    "pywinstyles>=1.8",
    "pyzipper>=0.4.0",
    "wxpython",
    "pillow>=12.3.0",
]

[tool.uv.sources]
wxpython = { path = "wheels/wxpython-4.3.0a16064+246cff28-cp312-cp312-win_amd64.whl" }

[project.optional-dependencies]
analysis = [
    "jinja2>=3.1.6",
    "lizard>=1.19.0",
    "radon>=6.0.1",
    "viztracer>=1.1.1",
]

[dependency-groups]
dev = [
    "babel>=2.17.0",
]
